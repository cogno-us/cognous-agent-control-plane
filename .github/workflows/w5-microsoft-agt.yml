name: W5 Microsoft AGT compatibility

on:
  pull_request:
    paths:
      - "src/agent_control_plane/microsoft_agt.py"
      - "tests/test_microsoft_agt.py"
      - "docs/microsoft-agt-compatibility.md"
      - ".github/workflows/w5-microsoft-agt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Control Plane
        run: python -m pip install -e ".[dev]"
      - name: Install pinned Microsoft AGT SDK
        run: python -m pip install "git+https://github.com/microsoft/agent-governance-toolkit.git@84ae67348705996a3d65e31936afb7d02853f2a0#subdirectory=policy-engine/sdk/python"
      - name: Run W5 qualification
        run: python -m pytest -q tests/test_microsoft_agt.py
